# tvchannel settings. Copy this file to config.yaml (which git ignores) and fill in your own IDs, then restart the TV (see README).
# Anything you delete falls back to the default built into src/config.js.
# Secrets (tokens, API key) do NOT go here; they live in .env.

discord:
  guild_id: ""   # your server (right-click server > Copy ID)
  now_playing_channel_id: ""   # channel for "now playing" posts
  admin_user_id: "*"           # who can use /tvadmin (skip, sync, regen...): a user ID, or "*" for anyone.
  daily_guide: true            # post the whole day's programming just after midnight
  guide_channel_id: ""         # where that goes (blank = the now-playing channel)
  drop_thread_id: ""   # "Commercials" thread: anyone posts links there, they become commercials
  clip_thread_id: ""   # "Clips" thread: same, as clips
  eyecatch_thread_id: ""   # "Eyecatchers" thread: same, as eyecatches

broadcast:
  timezone: America/New_York
  grid_minutes: 5              # planned block times round to this; while the TV is on, times follow what actually played
  between_spots: 2             # videos in the break between shows (the first is sometimes a clip, see clip_chance)
  inside_spots: 1              # commercials in a break inside a show (at a fade to black): 1, or 2 = add a second when both are short
  short_spot_seconds: 35       # with inside_spots 2: "short" means this long or less
  eyecatches: tv               # an eyecatch before and after a break inside a show: tv (what Claude judged would air with TV breaks: sitcoms, cartoons, network dramas, rom-coms...), all, or none. Anime included, but never with the show's own eyecatches
  # A folder of commercials counts as one brand (so 88 Pop-Tarts ads don't take over);
  # folders named here are packs of many different ads, and each file counts on its own.
  variety_folders: ["commercialpack1", "Collectionof90sCommercials"]
  episode_breaks: 1            # most breaks inside one episode (the one nearest the middle); 0 = none. Movies still get one about every 30 min
  break_every_minutes: 8       # no break between shows after less than this much show (back-to-back shorts)
  max_spot_minutes: 3          # longest commercial/clip that plays in a break
  max_show_block_minutes: 75   # regular blocks of episodes are at most this long (movies and specials can run longer)
  split_without_chapters: true # if a file has no chapter markers, allow a break at its middle (may be mid-scene)
  clip_chance: 0.3             # chance a break includes one of the clips (0 to 1)
  no_repeat_days: 14           # don't reuse an episode/movie within this many days
  plan_days: 1                 # how far ahead blocks are filled from the week's grid (upkeep tops it up)
  grid_weeks_ahead: 2          # how far ahead Claude lays out the grid of block kinds (a week at a time)
  # Same block at the same time every week, whatever the weekly grid says (exact bucket
  # name; tv.cmd buckets). What the grid had at "to" carries on after it.
  standing_slots:
    - { day: saturday, from: "05:30", to: "12:15", bucket: "Saturday Morning Cartoons" }
  specials_per_week: 0         # extra Claude-picked specials each week (0 = only on request; the weekly grid has marathons already)
  idle_leave_minutes: 5        # leave voice after this long with nobody watching
  no_premiere_hours: ["02:30", "07:00"]   # no serialized show starts from its first episode (and no "Series Premiere" block) in this window; [] = anytime

plex:
  server_name: ""
  libraries: ["Movies", "Anime/TV Shows", "Other Media"]
  include_unmatched: false     # items Plex couldn't identify at all (raw filenames) stay off the schedule
  include_show_only_matches: true  # episodes of a known show that Plex couldn't pin down (no episode title)

shows:
  # Exact show titles as Plex shows them (tv.cmd stats / the TV guide).
  random: []                   # always random episodes (overrides Claude's serialized/episodic call)
  in_order: ["How to Succeed in Business"]   # always in order (that one's a musical in 4 parts)
  never: []                    # these never get scheduled
  # A show whose episodes should all come from one source (plex, local or realdebrid): its
  # copies from the other sources are left out, even for episodes the chosen one lacks.
  # For a show whose copy in one place is broken or mislabeled.
  prefer_source:
    Steins; Gate: realdebrid   # Plex's copy is broken (clips listed as episodes)
  # Show names from Real-Debrid / local folders that mean a Plex show (or each other).
  # Case, punctuation, a "(2019)"/"(US)" tag and "S2"/"2nd Season" are matched by
  # themselves; these are the ones that need telling (other language, other wording).
  # A name mapped to itself is never merged. Applied at the next sync.
  # A show Plex has filed under the wrong name (its files are really the other show); applies to Plex too.
  rename:
    Zero-one: Mr. Bean
  aliases:
    Boku no Hero Academia: My Hero Academia
    Vigilante - Boku no Hero Academia Illegals: "My Hero Academia: Vigilantes"
    Dungeon Meshi: Delicious in Dungeon
    Kimetsu no Yaiba: Demon Slayer
    Tongari Boushi no Atelier: Witch Hat Atelier
    JoJo: JoJo's Bizarre Adventure
    Bleach： Sennen Kessen Hen: "Bleach: Thousand-Year Blood War"
    Dirilis: Dirilis Ertugrul
    Haikyu!!: Haikyuu!!
    Princess Session Orchestra: Princession Orchestra
    Arcane League of Legends: Arcane
    Pop Star Akademisi KATSEYE (2024): Pop Star Academy KATSEYE
    Love Island USA: Love Island (US)
    Hibi wa Sugiredo: Hibi wa Sugiredo Meshi Umashi
    怒呛人生 第一季 Beef (2023): Beef
    Interview with the Vampire - The Vampire Lestat: Interview with the Vampire

buckets:
  # Exact bucket names (tv.cmd buckets). Shows in these kinds of blocks always play
  # random episodes / always in order; a show's own setting above still wins. Buckets
  # not listed follow each show (Claude's serialized/episodic call).
  shuffle: []                  # e.g. ["Nick at Nite", "Sitcoms"]
  in_order: []

language:
  audio: eng                   # preferred audio language
  subtitles: eng               # subtitle language
  always_subtitles: true       # show subtitles whenever a file has them, even with English audio
  # Shows whose foreign-audio files have subtitles burned into the picture (no subtitle
  # track). Exact show title as Plex shows it. Otherwise those files are skipped.
  hardsubbed_shows: []

local:
  shows: D:\data\tv\shows            # <Show Name>\...\Show S01E02.mkv
  movies: D:\data\tv\movies          # Movie Title (1994).mkv
  clips: D:\data\tv\clips            # tag in clips\tags.csv
  commercials: D:\data\tv\commercials  # tag in commercials\tags.csv
  shorts: D:\data\tv\shorts        # <Series>\Series S01E02.mkv; short (2-15 min) shows that fill gaps after a skip
  eyecatches: D:\data\tv\eyecatches  # a minute or less each; used by any eligible show, except a folder named after a show isn't used on that show
  # Loose folders of shows and movies, any layout (the Seagate drive): each file is
  # identified by its release name. Unplugged = off the schedule until it's back.
  library: ['E:\TV Shows', 'E:\Anime', 'E:\Movies', 'E:\Musicals']

realdebrid:
  # Every finished torrent on the Real-Debrid account (RD_TOKEN in .env) joins the
  # catalog: shows and movies, named from the release names. No token = skipped.
  enabled: true
  min_file_mb: 50              # smaller video files are skipped (samples, extras)
  skip_torrents: []            # torrents whose name contains any of these stay out, e.g. ["Sample", "Trailer"]

encode:
  height: 720
  frame_rate: 30
  bitrate_kbps: 2500
  max_bitrate_kbps: 4000
  hw_decode: false             # GPU decoding: doesn't work under the Windows service (no desktop); leave off
  encoder: qsv                 # software (CPU) or qsv (Intel Quick Sync, needs the Intel driver)

entrance:
  max_seconds: 8               # /entrance uploads are trimmed to this
  loudness_lufs: -32           # volume for all mic sounds; closer to 0 = louder (-20 is loud, -32 quiet)

player:
  port: 7651                   # local-only port the bot uses to talk to the player
  spool_max_gb: 30             # download-ahead folder (for subtitles inside files) never grows past this
  spool_max_mbps: 20           # download-ahead speed limit, leaving the Plex server's upload for the live stream
  spool_max_file_gb: 8         # files bigger than this aren't downloaded ahead; they play without subtitles
  stream_preview_minutes: 5    # how often the Go Live thumbnail updates (0 = no thumbnail)

claude:
  model: claude-sonnet-5       # used for tagging (and scheduling, with scheduling: api)
  # local: no API for scheduling. The grid comes from programming.yaml, and a weekly
  # Claude Code job on glados (scripts\weekly-program.ps1, PROGRAMMING.md) curates the
  # buckets and the template. api: Claude API calls plan the grid and new buckets weekly.
  scheduling: local

# A weather report from the National Weather Service (US places): one clean static board (every
# place, its next few hours side by side), read over by a different TTS voice per place. In the
# first commercial break after each time. Remove this section (or leave "times" empty) for no weather.
weather:
  times: ["07:00", "18:00"]
  window_hours: 3
  rate: 0                     # -10 (slow) to 10 (fast), applies to the Microsoft/edge-tts voices
  locations:
    - { name: "New York, New York", lat: 40.7128, lon: -74.006 }
  # Who reads it: one is picked per place, at random by weight (they can repeat - there's no
  # shortage like there was with character-voice models). "edge:<voice>" is a Microsoft/Azure
  # neural voice (via edge-tts); "google:<lang>" is the Google Translate TTS voice for that
  # language, any code. The special values "edge:random" / "google:random" pick randomly from
  # `pool` (edge) or a built-in language grab-bag (google) each time that tier comes up. Leave
  # this out entirely for a sensible default pool.
  voices:
    - { name: "Tita", voice: "google:fil", weight: 50 }
    - { name: "the Bengali voice", voice: "google:bn", weight: 15 }
    - { name: "the English voice", voice: "google:en", weight: 12 }
    - { name: "a Microsoft voice", voice: "edge:random", weight: 15, pool: ["en-US-SteffanNeural", "en-US-GuyNeural", "en-US-DavisNeural", "en-US-TonyNeural", "en-US-JasonNeural"] }
    - { name: "a mystery voice", voice: "google:random", weight: 8 }
