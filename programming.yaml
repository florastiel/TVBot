  AFT_MOVIE: [Campy Halloween Classics, Cozy Halloween Cartoons, Classic Hollywood, Family Movie Night, Studio Ghibli Matinee, Pixar Picture Show, Cozy Anime Autumn, Studio Ghibli Melancholy]
  AFT_TV: [Courage Hour, Anime Comedy Club, Rom-Com Anime Hearts, Isekai Escapes, Mecha and Monsters, X-Men Legacy, Detective Conan Case Files,
    Sitcom Rerun Central, Reality Check, Shonen Sunday, Halloween Episodes, Thanksgiving Episodes, Christmas Episodes]
  AFT_SERIES: [Muppet Marathon, Peanuts Specials, Halloweentown Saga, Pink Panther Marathon, Toy Story Saga, Dragon Ball Movie Vault, Detective Conan Movie Vault, Mission Impossible Marathon]
  EVE_TV: [Courage Hour, Dark Serial Night, Prime Time Procedurals, Sitcoms, Nick at Nite, Whodunit Theater, Reality Check, British Comedy Classics, Superhero Prime Time,
    Sci-Fi Signal, Sitcom Rerun Central, Halloween Episodes, Spooky Season Anime, Thanksgiving Episodes, Christmas Episodes]
  MON_MOVIE: [Heist Night, Spy Games]
